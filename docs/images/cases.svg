<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="40" y="56" font-size="32" fill="#273238">问题修复示意｜全部使用虚构数据，不是官方答案</text><circle cx="64" cy="121" r="11" fill="#2F6B61"/><text x="100" y="132" font-size="25" fill="#273238">判断值与证据分离</text><text x="100" y="163" font-size="21" fill="#273238">虚构问题：甲是否含镍？旧输出“铝、铁” → 最终“否” + 单独保存原文</text><text x="100" y="194" font-size="19" fill="#273238">先确认确为甲行，不能从邻行的“镍”推断；未知、空白不能自动等于否</text><path d="M64 132V222" stroke="#D8DEDF"/><circle cx="64" cy="233" r="11" fill="#2F6B61"/><text x="100" y="244" font-size="25" fill="#273238">数组保留位置与类型</text><text x="100" y="275" font-size="21" fill="#273238">虚构原行：[&quot;0012&quot;, &quot;&quot;, &quot;0&quot;, &quot;—&quot;]，不能压成 [12, 0]</text><text x="100" y="306" font-size="19" fill="#273238">字段契约固定位置；编号、空白、零、横杠分别处理；不拼接两份不完整答案</text><path d="M64 244V334" stroke="#D8DEDF"/><circle cx="64" cy="345" r="11" fill="#2F6B61"/><text x="100" y="356" font-size="25" fill="#273238">局部结构是范围并集</text><text x="100" y="387" font-size="21" fill="#273238">完整表4行3列，取前1行和前1列：保留第0行，以及第0列的真实单元格</text><text x="100" y="418" font-size="19" fill="#273238">row_count=4、col_count=3保持完整尺寸；合并覆盖位置不补占位格</text><path d="M64 356V446" stroke="#D8DEDF"/><circle cx="64" cy="457" r="11" fill="#2F6B61"/><text x="100" y="468" font-size="25" fill="#273238">读取目标与坐标分离</text><text x="100" y="499" font-size="21" fill="#273238">正文有文字层，但目标表是嵌入图片：仅抽原生文字会漏掉表</text><text x="100" y="530" font-size="19" fill="#273238">检查页面栅格区域，补充识别；仍保留原图、来源标签与坐标</text><path d="M64 468V558" stroke="#D8DEDF"/><circle cx="64" cy="569" r="11" fill="#2F6B61"/><text x="100" y="580" font-size="25" fill="#273238">极小裁剪的接口兼容</text><text x="100" y="611" font-size="21" fill="#273238">原裁剪116×9像素 → 116×12白色画布；原像素位于左上角</text><text x="100" y="642" font-size="19" fill="#273238">仅在右侧 / 下侧补白，零插值、零邻字扩张；这是请求修复，不是图像变清晰</text></g></svg>