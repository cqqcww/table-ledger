<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="40" y="56" font-size="32" fill="#273238">验证设计｜先证明能力，再观察迁移</text><circle cx="64" cy="121" r="11" fill="#2F6B61"/><text x="100" y="132" font-size="25" fill="#273238">按来源划分，而非按题随机切分</text><text x="100" y="163" font-size="21" fill="#273238">同一文档的全部问题留在同一侧；模板家族也需要隔离</text><text x="100" y="194" font-size="19" fill="#273238">看过反馈的保留题转为回归题；历史 holdout 标签不等于仍然盲测</text><path d="M64 132V222" stroke="#D8DEDF"/><circle cx="64" cy="233" r="11" fill="#2F6B61"/><text x="100" y="244" font-size="25" fill="#273238">模型输入与参考答案分离</text><text x="100" y="275" font-size="21" fill="#273238">输入仅问题和文档；生成器源表、expected只交给评分端</text><text x="100" y="306" font-size="19" fill="#273238">运行冻结模型、提示、代码、图像摘要与评分器</text><path d="M64 244V334" stroke="#D8DEDF"/><circle cx="64" cy="345" r="11" fill="#2F6B61"/><text x="100" y="356" font-size="25" fill="#273238">不同能力分别测</text><text x="100" y="387" font-size="21" fill="#273238">字符串严格匹配；数字检查单位与精度；数组整题有序匹配；结构检查几何</text><text x="100" y="418" font-size="19" fill="#273238">原生文字辅助、真实图片、人工合成图片分别报告，不能混成一个分数</text><path d="M64 356V446" stroke="#D8DEDF"/><circle cx="64" cy="457" r="11" fill="#2F6B61"/><text x="100" y="468" font-size="25" fill="#273238">记录纠正与改坏</text><text x="100" y="499" font-size="21" fill="#273238">G=旧错新对；L=旧对新错；净纠正=G−L；同时报告成本、延迟、覆盖</text><text x="100" y="530" font-size="19" fill="#273238">净纠正率必须写清分母；例如 (G−L) / 旧流程错误题数</text><path d="M64 468V558" stroke="#D8DEDF"/><circle cx="64" cy="569" r="11" fill="#2F6B61"/><text x="100" y="580" font-size="25" fill="#273238">检验真实收益</text><text x="100" y="611" font-size="21" fill="#273238">公开开发 → 冻结来源独立确认 → 窄范围迁移 → 完整文件检查</text><text x="100" y="642" font-size="19" fill="#273238">没通过开发关的分支不能宣称已确认；探索性全量运行另行标注</text></g></svg>